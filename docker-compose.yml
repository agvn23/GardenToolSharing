services:
  api:
    build:
      context: ./GardenToolSharing.Api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Data Source=/data/tools.db
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in a .env file next to docker-compose.yml}
      Jwt__Issuer: GardenToolSharing
      Jwt__Audience: GardenToolSharing
    volumes:
      - tools-data:/data

  web:
    build:
      context: ./garden-tool-sharing-web
      args:
        # The browser calls the API directly, so this is the address as seen from your machine
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"   # same host port as `npm run dev`, which the Api's CORS policy allows
    depends_on:
      - api

volumes:
  tools-data: